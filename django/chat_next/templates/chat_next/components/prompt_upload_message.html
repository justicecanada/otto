{% load i18n %}

<div id="chat-upload-message"
     class="px-2 pb-2 {% if hidden %}d-none{% endif %}">
  <div class="message-outer">
    <div class="message-meta text-muted">
      <span class="message-author me-1">{{ request.user.full_name }}</span>
      <span class="message-date">({% trans "now" %})</span>
    </div>
    <div class="d-flex justify-content-end">
      <div class="message-mode text-secondary pt-2 me-2">
        <i class="bi bi-paperclip"></i>
        <div class="spinner-border spinner-border-sm" id="upload-spinner"></div>
      </div>
      <div class="message-blob">
        <div class="message-text" id="upload-progress-files"></div>
      </div>
    </div>
  </div>
</div>
