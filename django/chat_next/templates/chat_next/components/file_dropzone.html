{% load i18n %}

<div class="d-flex align-items-center justify-content-center"
     id="file-dropzone">
  <form id="chat-file-form">
    <button id="chat-file-area"
            class="rounded d-block text-center text-light"
            type="button">
      <p class="mb-3 h3">
        <i class="bi bi-upload"></i>
      </p>
      <p class="mb-1 h5 fw-normal">{% trans "Drop files anywhere" %}</p>
    </button>
  </form>
</div>
<script>
  // Drag and drop file upload
  function ePrevent(e) {
    e.preventDefault();
    e.stopPropagation();
  }
  let _pendingLibrarianRefresh = false;

  // After a chat upload completes (htmx:afterSwap on #messages-container), refresh
  // the librarian modal so it picks up the new document and starts polling.
  document.addEventListener('htmx:afterSwap', function(e) {
    if (_pendingLibrarianRefresh && e.detail && e.detail.target && e.detail.target.id === 'messages-container') {
      _pendingLibrarianRefresh = false;
      document.dispatchEvent(new CustomEvent('refresh'));
    }
  });

  function onDrop(e) {
    e.preventDefault();
    e.stopPropagation();

    if (shouldRouteDropToChatFromLibrarianModal()) {
      _pendingLibrarianRefresh = true;
    }

    document.querySelector('#id_chat-input_file').value = null;
    document.querySelector('#id_chat-input_file').files = e.dataTransfer.files;
    document.querySelector('#id_chat-input_file').dispatchEvent(new Event('change'));
    hideOverlay();
  }

  function shouldRouteDropToChatFromLibrarianModal() {
    const legacyModal = document.querySelector('#editLibrariesModal.show');
    const sharedModal = document.querySelector('#chat-next-modal.show');
    const modal = sharedModal && sharedModal.querySelector('[data-chat-next-modal-view="librarian"]') ? sharedModal : legacyModal;
    if (!modal) {
      return false;
    }

    return (
      typeof window.shouldRouteDragToChatUploadsFromLibrarian === 'function'
      && window.shouldRouteDragToChatUploadsFromLibrarian()
    );
  }

  function handleDragEnter(e) {
    if (document.querySelector('#editLibrariesModal')?.classList.contains('show') || document.querySelector('#chat-next-modal')?.classList.contains('show')) {
      if (!shouldRouteDropToChatFromLibrarianModal()) {
        return;
      }
    }

    // make sure we're dragging a file
    var dt = (e && e.dataTransfer);
    if (!dt) {
      return;
    }
    // required to create an array for Firefox 
    Array.from(dt.types)?.forEach((type) => {
      if (type === "Files") {
        showOverlay();
      }
    });    
  }

  function handleDragLeave(e) {
    // Check if the related target is not a child of the drop zone
    const dropZoneElement = document.querySelector('#file-dropzone');
    if (!e.relatedTarget || !dropZoneElement.contains(e.relatedTarget)) {
      hideOverlay();
    }
  }

  function showOverlay() {
    document.querySelector('#file-dropzone').classList.add('show');
  }

  function hideOverlay() {
    document.querySelector('#file-dropzone').classList.remove('show');
  }

  let dropZone = document.querySelector('#file-dropzone');
  window.addEventListener('dragenter', handleDragEnter);
  dropZone.addEventListener('dragover', ePrevent);
  window.addEventListener('dragleave', handleDragLeave);
  window.addEventListener('dragexit', handleDragLeave);
  dropZone.addEventListener('drop', onDrop);

  function handleWindowDragOver(e) {
    if (shouldRouteDropToChatFromLibrarianModal()) {
      ePrevent(e);
      showOverlay();
    }
  }

  function handleWindowDrop(e) {
    if (shouldRouteDropToChatFromLibrarianModal()) {
      onDrop(e);
    }
  }

  window.addEventListener('dragover', handleWindowDragOver);
  window.addEventListener('drop', handleWindowDrop);

</script>
