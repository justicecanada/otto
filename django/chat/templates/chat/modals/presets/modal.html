{% load i18n %}

<div class="modal modal-xl fade"
     id="presets-modal"
     tabindex="0"
     aria-label='{% trans "Settings Presets" %}'
     aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      {% include "chat/modals/presets/modal_header.html" %}
      <div id="presets-modal-body"></div>
    </div>
  </div>
</div>

<script>
function handlePresetModalSubmit(event) {
  const form = document.getElementById("edit_preset_form");
  const nameEnElement = document.getElementById("id_name_en").value;
  const nameFrElement = document.getElementById("id_name_fr").value;
  const sharingOptionElement = document.querySelector('input[name="sharing_option"]:checked');
  const sharingOption = sharingOptionElement ? sharingOptionElement.value : "";
  // Check for selected values in autocomplete hidden inputs
  const accessibleToInputs = document.querySelectorAll('input[name="accessible_to"]');
  const editableByInputs = document.querySelectorAll('input[name="editable_by"]');
  const hasAccessibleTo = Array.from(accessibleToInputs).some(input => input.value);
  const hasEditableBy = Array.from(editableByInputs).some(input => input.value);
  const errorMessage = document.getElementById("error-message");
  let isValid = true;
  if (!nameEnElement && !nameFrElement) {
    errorMessage.innerText = "{% trans 'Please provide a title in either English or French.' %}";
    errorMessage.classList.remove('d-none');
    event.preventDefault();
    event.stopPropagation();
    isValid = false;
  }

  if (sharingOption === 'others' && !hasAccessibleTo && !hasEditableBy) {
    errorMessage.innerText = "{% trans 'Please provide at least one user to share with or allow to edit.' %}";
    errorMessage.classList.remove('d-none');
    event.preventDefault();
    event.stopPropagation();
    isValid = false;
  }

  if (!form.checkValidity()) {
    event.preventDefault();
    event.stopPropagation();
    isValid = false;
  }
  // Only dismiss modal if validation passes
  if (!isValid) {
    errorMessage.focus();
  }
}

// event listener for submit
document.addEventListener("submit", function(event) {
  const form = event.target;
  // Check if this form is inside the presets modal
  if (!form.closest('#presets-modal')) {
    return;
  }

  const promptField = form.querySelector("input[name='prompt']");
  const chatPrompt = document.getElementById('chat-prompt');
  
  if (promptField && chatPrompt) {
    promptField.value = chatPrompt.value;
  }
}, true);
</script>
