{% load i18n %}
{% load tags %}

{% get_librarian_modal_url item_type item.id as modal_url %}
<li class="list-group-item {% if item.temp %}temp{% endif %}"
    role="option"
    tabindex="0"
    onkeypress="if(event.key === 'Enter') { this.click(); }"
    {% if item == selected_item %}aria-selected="true"{% endif %}
    {% if item_type == "library" %}data-library-id="{{ item.id }}"{% elif item_type == "data_source" %}onclick="setLocalStorageValue(false)"{% endif %}
    {% if not item.temp %}hx-get="{{ modal_url }}" {% if item_type == 'document' %}hx-include="#librarian-search-form"{% endif %}
    {% endif %}>{% include "librarian/components/list_item_inner.html" %}</li>
