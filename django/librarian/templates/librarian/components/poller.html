{% if poll_url %}
  {# Start/continue polling #}
  <div id="libraryModalPoller"
       hx-disinherit="*"
       hx-get="{{ poll_url }}"
       hx-trigger="every 2s[!document.querySelector('#librarian-document-list li.processing-request') && !document.querySelector('#librarian-details input:focus, #librarian-details textarea:focus, #librarian-details select:focus, #librarian-details .dropdown-menu.show')]"
       hx-ext="morph"
       hx-include="#librarian-search-form"
       hx-swap="morph:outerHTML"
       hx-target="#librarian-document-list"
       hx-request='{"timeout": 10000}'
       hx-swap-oob="true"></div>
{% else %}
  {# Stop polling #}
  <div id="libraryModalPoller" hx-swap-oob="true"></div>
{% endif %}

<script>
document.addEventListener('htmx:beforeRequest', function(event) {
    if (event.target.closest('#librarian-document-list')) {
        event.target.classList.add('processing-request');
    }
});

document.addEventListener('htmx:afterRequest', function(event) {
    if (event.target.closest('#librarian-document-list')) {
        event.target.classList.remove('processing-request');
    }
});
</script>
