{% load i18n %}

<div class="modal-body">
  <div class="alert alert-warning mb-3">
    <h2 class="h5 mb-2">{{ title }}</h2>
    <p class="mb-0">{{ description }}</p>
  </div>
  <div class="mb-3">
    <label class="form-label" for="api-client-plaintext-token">{% trans "Bearer token" %}</label>
    <textarea id="api-client-plaintext-token"
              class="form-control"
              rows="3"
              readonly>{{ plaintext_token }}</textarea>
  </div>
  <p class="small text-muted mb-0">
    {% trans "Store this token securely now. Otto only shows the complete secret once." %}
  </p>
</div>
<div class="modal-footer">
  <button type="button"
          class="btn btn-outline-secondary"
          onclick="navigator.clipboard.writeText(document.getElementById('api-client-plaintext-token').value)">
    {% trans "Copy token" %}
  </button>
  <button type="button" class="btn btn-primary" data-bs-dismiss="modal">{% trans "Done" %}</button>
</div>
<script>
(function() {
  const modalEl = document.getElementById('api-client-modal');
  if (!modalEl) {
    return;
  }
  const refreshPage = function() {
    window.location = "{% url 'manage_api_clients' %}";
  };
  modalEl.addEventListener('hidden.bs.modal', refreshPage, { once: true });
})();
</script>
